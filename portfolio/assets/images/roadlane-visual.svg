<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="100%" height="100%" fill="none" style="background: linear-gradient(145deg, #0b1329 0%, #0d1b38 100%); border-radius: 14px;">
  <defs>
    <!-- Background Grid -->
    <pattern id="road-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
    </pattern>

    <!-- Forecast Projection Area Gradient -->
    <linearGradient id="forecast-zone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Capacity Threshold Gradient -->
    <linearGradient id="cap-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>

    <!-- Traffic Demand Line Gradient -->
    <linearGradient id="demand-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a5f3fc"/>
    </linearGradient>

    <filter id="road-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Grid Fill -->
  <rect width="100%" height="100%" fill="url(#road-grid)"/>

  <!-- Card Header Bar -->
  <rect x="30" y="24" width="660" height="42" rx="8" fill="#132247" opacity="0.8"/>
  <circle cx="50" cy="45" r="4.5" fill="#f43f5e" opacity="0.8"/>
  <circle cx="66" cy="45" r="4.5" fill="#eab308" opacity="0.8"/>
  <circle cx="82" cy="45" r="4.5" fill="#10b981" opacity="0.8"/>
  <text x="105" y="49" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="0.5">road lane requirement.py — Traffic Demand &amp; Lane Forecast</text>
  <rect x="535" y="32" width="140" height="24" rx="12" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="0.8"/>
  <text x="548" y="48" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Model: Capacity Expansion</text>

  <!-- Parameters Badges Row -->
  <!-- Param 1: AVRR -->
  <rect x="30" y="82" width="150" height="74" rx="8" fill="#0f1f42" stroke="#1e3a8a" stroke-width="1"/>
  <text x="44" y="103" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" font-weight="500">AVRR (Veh. Rate)</text>
  <text x="44" y="137" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="26" font-weight="700">42.5<tspan font-size="13" fill="#64748b" font-weight="400"> km/h</tspan></text>

  <!-- Param 2: PHF -->
  <rect x="195" y="82" width="150" height="74" rx="8" fill="#0f1f42" stroke="#1e3a8a" stroke-width="1"/>
  <text x="209" y="103" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" font-weight="500">Peak Hour Factor</text>
  <text x="209" y="137" fill="#818cf8" font-family="'Outfit', sans-serif" font-size="26" font-weight="700">0.88<tspan font-size="13" fill="#64748b" font-weight="400"> PHF</tspan></text>

  <!-- Param 3: Pop Growth -->
  <rect x="360" y="82" width="150" height="74" rx="8" fill="#0f1f42" stroke="#1e3a8a" stroke-width="1"/>
  <text x="374" y="103" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" font-weight="500">Pop. Density Growth</text>
  <text x="374" y="137" fill="#34d399" font-family="'Outfit', sans-serif" font-size="26" font-weight="700">+4.2%<tspan font-size="13" fill="#64748b" font-weight="400"> /yr</tspan></text>

  <!-- Param 4: Recommendation -->
  <rect x="525" y="82" width="165" height="74" rx="8" fill="#0f1f42" stroke="#1e3a8a" stroke-width="1"/>
  <text x="539" y="103" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" font-weight="500">Forecasted Action</text>
  <text x="539" y="136" fill="#f59e0b" font-family="'Outfit', sans-serif" font-size="22" font-weight="700">4 → 6 Lanes</text>

  <!-- Chart Canvas Box -->
  <rect x="30" y="174" width="660" height="236" rx="10" fill="#09142e" stroke="#1e293b" stroke-width="1"/>

  <!-- Future Forecast Shaded Region -->
  <rect x="390" y="185" width="270" height="180" fill="#0369a1" fill-opacity="0.06"/>
  <line x1="390" y1="185" x2="390" y2="365" stroke="#38bdf8" stroke-dasharray="4 4" stroke-width="1.2"/>
  <text x="396" y="198" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600">◄ PREDICTIVE FORECAST HORIZON ►</text>

  <!-- Y-Axis Grid Lines & Capacity Thresholds -->
  <!-- 6-Lane Capacity Line -->
  <line x1="75" y1="210" x2="660" y2="210" stroke="#f43f5e" stroke-dasharray="4 4" opacity="0.6"/>
  <text x="45" y="214" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="9.5">6-Lane</text>

  <!-- 4-Lane Capacity Line (Exceeded In Forecast) -->
  <line x1="75" y1="265" x2="660" y2="265" stroke="#f59e0b" stroke-dasharray="4 4" opacity="0.8"/>
  <text x="45" y="269" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="9.5">4-Lane</text>

  <!-- 2-Lane Capacity Line -->
  <line x1="75" y1="320" x2="660" y2="320" stroke="#10b981" stroke-dasharray="4 4" opacity="0.5"/>
  <text x="45" y="324" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9.5">2-Lane</text>

  <line x1="75" y1="365" x2="660" y2="365" stroke="#334155" stroke-width="1.2"/>
  <text x="45" y="369" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9.5">0</text>

  <!-- Demand Projection Area Fill -->
  <path d="M 90 365 L 90 335 Q 220 310 330 280 T 470 240 T 630 205 L 630 365 Z" fill="url(#forecast-zone)"/>

  <!-- Demand Projection Line -->
  <path d="M 90 335 Q 220 310 330 280 T 470 240 T 630 205" fill="none" stroke="url(#demand-line)" stroke-width="3" filter="url(#road-glow)"/>

  <!-- Historical & Forecast Markers -->
  <circle cx="90" cy="335" r="4.5" fill="#080d1a" stroke="#38bdf8" stroke-width="2.5"/>
  <circle cx="210" cy="312" r="4.5" fill="#080d1a" stroke="#38bdf8" stroke-width="2.5"/>
  <circle cx="330" cy="280" r="4.5" fill="#080d1a" stroke="#38bdf8" stroke-width="2.5"/>
  <circle cx="430" cy="254" r="5" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
  <circle cx="530" cy="228" r="4.5" fill="#080d1a" stroke="#38bdf8" stroke-width="2.5"/>
  <circle cx="630" cy="205" r="5.5" fill="#38bdf8" stroke="#ffffff" stroke-width="2.5"/>

  <!-- Capacity Breach Trigger Callout -->
  <rect x="410" y="270" width="138" height="34" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="418" y="284" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600">Threshold Breached</text>
  <text x="418" y="297" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8.5">4-Lane Cap &lt; Traffic Demand</text>

  <!-- X-Axis Labels (Years / Horizons) -->
  <text x="75" y="385" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10.5">Year 1</text>
  <text x="195" y="385" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10.5">Year 3</text>
  <text x="315" y="385" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10.5">Year 5</text>
  <text x="415" y="385" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600">Year 7</text>
  <text x="515" y="385" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10.5">Year 9</text>
  <text x="615" y="385" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600">Year 11</text>

  <!-- Chart Legends -->
  <line x1="80" y1="190" x2="105" y2="190" stroke="#38bdf8" stroke-width="2.5"/>
  <circle cx="92" cy="190" r="3" fill="#38bdf8"/>
  <text x="112" y="194" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10.5">Projected Traffic Demand</text>

  <line x1="260" y1="190" x2="285" y2="190" stroke="#f59e0b" stroke-dasharray="3 3" stroke-width="1.8"/>
  <text x="292" y="194" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10.5">4-Lane Capacity Limit</text>
</svg>
